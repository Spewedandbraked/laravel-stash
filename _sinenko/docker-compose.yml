services:
    php:
        build:
            context: ../
            dockerfile: _sinenko/docker/php/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_php
        volumes:
            - /var/www/html/vendor
        networks:
            - laravel
        depends_on:
            - postgres
    postgres:
        image: postgres:16
        container_name: ${COMPOSE_PROJECT_NAME}_postgres
        environment:
            - POSTGRES_DB=${DB_NAME:-app}
            - POSTGRES_USER=${DB_USER:-app}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
        volumes:
            - pg_data:/var/lib/postgresql/data
        networks:
            - laravel
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    nginx:
        image: nginx:alpine
        container_name: ${COMPOSE_PROJECT_NAME}_nginx
        ports:
            - "${NGINX_PORT:-80}:80"
            # - "${ :-443}:443"
        volumes:
            - ../:/var/www/html
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - laravel
        depends_on:
            - php

volumes:
    pg_data:

networks:
    laravel:
        driver: bridge
